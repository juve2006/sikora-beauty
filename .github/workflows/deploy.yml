name: Deploy

# Development host: Vercel (Hobby) with Neon. Vercel's own Git deploys are off (vercel.json),
# so this workflow is the only way in, and only after CI passed.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  deploy:
    needs: ci
    # Skipped, not red, until the Vercel project exists (docs/deploy.md).
    if: vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Installed in its own step, without install scripts: nothing the CLI pulls in runs
      # next to the token, which reaches the whole Vercel account.
      - run: npm install --global --ignore-scripts vercel@64.0.2
      # Vercel builds with `npm run vercel-build`: migrations on Neon, then `next build`.
      # A failed migration or build exits non-zero and turns this job red.
      - run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
