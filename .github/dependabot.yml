version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on TypeScript 6 until the developer chooses to move to 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
