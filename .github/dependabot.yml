version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on TypeScript 6 until the developer chooses to move to 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types follow the Node major we run (.nvmrc), which changes only by a decision.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Payload's packages take graphql ^16 as a peer: 17 fails `npm ci` until Payload moves to it.
      - dependency-name: graphql
        update-types: ["version-update:semver-major"]
